<article class="post-preview">
  <a href="{{ .Permalink }}">
    <h2 class="post-title">
      {{ .Title }}
      {{ if .Page.Draft }}
      <span class="draft-tag">(Draft)</span>
      {{ end }}

      {{ range .Params.Authors }}
	  <span class="ellipsis"style="padding-left:0.5em; font-size:0.6em; font-weight:300">{{ . }}</span>
	  {{ end }}
    </h2>
  </a>

  <div class="post-entry">
    <p>{{ .Summary | plainify | strings.Truncate 150 }}</p>
    {{ if .Truncated }}
    <a href="{{ .RelPermalink }}" class="post-read-more">{{ i18n "read-more" }}</a>
    {{ end }}
  </div>

  <div class="postmeta">
    {{ partial "postmeta.html" . }}
  </div>
</article>
